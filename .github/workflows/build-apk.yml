name: Build APK

# এই workflow GitHub-এর সার্ভারে (x86-64 Linux) APK বানিয়ে
# "artifacts" হিসেবে ডাউনলোডের সুযোগ দেয় — ফোনে Flutter লাগে না।

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Inject google-services.json from secret
        env:
          GCS_B64: ${{ secrets.GOOGLESERVICES_BASE64 }}
        run: |
          if [ -z "$GCS_B64" ]; then
            echo "::error::GOOGLESERVICES_BASE64 secret set করুন (google-services.json का base64)"
            exit 1
          fi
          echo "$GCS_B64" | base64 -d > android/app/google-services.json
          ls -la android/app/google-services.json

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build split-per-abi APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mess-management-apk
          path: |
            build/app/outputs/flutter-apk/*.apk