name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Create google-services.json
        env:
          GCS_JSON: ${{ secrets.GOOGLESERVICES_JSON }}
        run: |
          if [ -z "$GCS_JSON" ]; then
            echo "::error::GOOGLESERVICES_JSON secret is missing"
            exit 1
          fi

          printf '%s' "$GCS_JSON" > android/app/google-services.json

          if [ ! -s android/app/google-services.json ]; then
            echo "::error::google-services.json was not created"
            exit 1
          fi

          echo "google-services.json created successfully"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mess-management-apk
          path: build/app/outputs/flutter-apk/*.apk
